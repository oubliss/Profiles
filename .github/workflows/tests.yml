name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'

      - name: Show resolved versions
        run: python -c "import numpy, pandas, metpy, netCDF4, scipy, pint; print(numpy.__version__, pandas.__version__, metpy.__version__, netCDF4.__version__, scipy.__version__, pint.__version__)"

      # The suite is hermetic: it uses test/data/coefs, never ~/.wxuas, and
      # makes no network calls.
      - name: Run tests
        run: python -m pytest -q
