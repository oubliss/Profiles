name: docs_pages_workflow

# execute this workflow automatically when a we push to master
on:
  push:

jobs:

  build_docs_job:
    runs-on: ubuntu-latest
    # python:3.12 matches the supported range in setup.py (>=3.10). The old
    # debian:buster image is end of life (its apt repos moved to
    # archive.debian.org) and ships Python 3.7, which cannot install this
    # package.
    container: python:3.12-slim-bookworm

    steps:

    - name: Prereqs
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        apt-get update
        apt-get install -y git
        git clone "https://token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .
      shell: bash

    - name: Execute script to build our documentation and update pages
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: "docsrc/buildDocs.sh"
      shell: bash